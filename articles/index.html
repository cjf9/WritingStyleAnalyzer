    <script>
        // ============================================================
        // POST FILES — Add new posts here.
        // Filenames are hex-encoded Unix timestamps (precision: minute).
        // Use: printf '%x\n' $(date -d "YYYY-MM-DD HH:MM:00 UTC" +%s)
        // Files sort chronologically by hex value via localeCompare.
        // ============================================================
        const POST_FILES = [
            '69f60a68.html',
            '69f61170.html',
            '69f71ca0.html',
            '6a009d70.html',
            '6a01eef0.html'
        ];
        // ============================================================

        async function loadBlogPosts() {
            const blogList = document.getElementById('blogList');
            const posts = [];

            for (const filename of POST_FILES) {
                try {
                    const url = 'posts/' + filename;
                    const res = await fetch(url);
                    if (!res.ok) continue;

                    const html = await res.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const h1 = doc.querySelector('h1');
                    const title = h1 ? h1.textContent.trim() : filename;

                    posts.push({ filename: url, title });
                } catch (e) {
                    // Skip files that can't be fetched
                }
            }

            // Sort by filename descending (date embedded in name, newest first)
            posts.sort((a, b) => a.filename.localeCompare(b.filename));

            if (posts.length === 0) {
                blogList.innerHTML = '<p style="color:#999;text-align:center;">No posts yet.</p>';
                return;
            }

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'blog-item';
                item.innerHTML = `
                    <a href="${post.filename}"><h3>${post.title}</h3></a>
                `;
                blogList.appendChild(item);
            });
        }

        loadBlogPosts();
    </script>
</body>
