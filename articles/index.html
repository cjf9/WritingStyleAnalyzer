    <div class="container">
        <div class="intro" style="text-align:center;padding-bottom:1.5rem;">
            <p class="ad-copy">How the analyzer works, and how to use it.</p>
        </div>

        <div class="blog-list" id="blogList"></div>
    </div>

    <script>
        // ============================================================
        // POST FILES — Add a new line here each time you add a post
        // Format: 'YYYY-MM-DD-HHMM-slug.html'
        // ============================================================
        const POST_FILES = [
            '2026-05-02-1430-welcome.html',
            '2026-05-02-1500-introduction.html',
            '2026-05-03-1000-introduction-to-word-frequency.html',
            '2026-05-10-1500-how-to-interpret-the-two-charts.html',
            '2026-05-11-1500-what-the-charts-actually-mean.html'
        ];
        // ============================================================

        async function loadBlogPosts() {
            const blogList = document.getElementById('blogList');
            const posts = [];

            for (const filename of POST_FILES) {
                try {
                    const url = 'posts/' + filename;
                    const res = await fetch(url);
                    if (!res.ok) continue;

                    const html = await res.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const h1 = doc.querySelector('h1');
                    const title = h1 ? h1.textContent.trim() : filename;

                    const dateMatch = filename.match(/^(\d{4}-\d{2}-\d{2})-(\d{4})-/);
                    const date = dateMatch ? dateMatch[1] : '';
                    const time = dateMatch ? dateMatch[2].slice(0,2) + ':' + dateMatch[2].slice(2) : '';

                    posts.push({ filename: url, title });
                } catch (e) {
                    // Skip files that can't be fetched
                }
            }

            // Sort by filename descending (date embedded in name, newest first)
            posts.sort((a, b) => a.filename.localeCompare(b.filename));

            if (posts.length === 0) {
                blogList.innerHTML = '<p style="color:#999;text-align:center;">No posts yet.</p>';
                return;
            }

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'blog-item';
                item.innerHTML = `
                    <a href="${post.filename}"><h3>${post.title}</h3></a>
                `;
                blogList.appendChild(item);
            });
        }

        loadBlogPosts();
    </script>
</body>
