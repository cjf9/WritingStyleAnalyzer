    <script>
        const POST_FILES = [
            '6a009d70.html',
            '6a01eef0.html'
        ];

        async function loadHelpPosts() {
            const helpList = document.getElementById('helpList');
            helpList.innerHTML = '<p style="color:#999;text-align:center;">Loading articles...</p>';

            const results = await Promise.allSettled(
                POST_FILES.map(async (filename) => {
                    const url = 'posts/' + filename;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('not found');
                    const html = await res.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const h1 = doc.querySelector('h1');
                    const title = h1 ? h1.textContent.trim() : filename;
                    return { filename: url, title };
                })
            );

            const posts = results
                .filter(r => r.status === 'fulfilled')
                .map(r => r.value);

            posts.sort((a, b) => a.filename.localeCompare(b.filename));

            if (posts.length === 0) {
                helpList.innerHTML = '<p style="color:#999;text-align:center;">No articles yet.</p>';
                return;
            }

            helpList.innerHTML = '';
            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'blog-item';
                item.innerHTML = `
                    <a href="${post.filename}"><h3>${post.title}</h3></a>
                `;
                helpList.appendChild(item);
            });
        }

        loadHelpPosts();
    </script>
