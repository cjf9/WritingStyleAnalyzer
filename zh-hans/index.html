<body>
    <nav>

        <ul>
            <li><a href="about.html">关于</a></li>

    <div class="container">
        <div class="intro">
            <div class="ad-copy"><h1>揭开你写作的秘密！</h1> 我们强大的分析工具帮助你理解文本中的句子长度分布和字频规律。适合希望提升写作能力的学生、作家和语言爱好者。</div>
        </div>

        <div class="input-block">
            <div class="textarea-wrap">
                <textarea id="textInput" placeholder="在此粘贴你的文本"></textarea>
            </div>
            <div class="submit-row">
                <button id="submitTextBtn" class="btn btn-primary">提交</button>
            </div>
            <div class="upload-hint-row">
                <span class="upload-hint">你也可以从设备上传 .txt 文件：</span>
                <input type="file" id="fileInput" accept=".txt" multiple style="display:none;">
                <button id="uploadBtn" class="btn btn-secondary">上传 TXT</button>
            </div>
        </div>

        <div id="submittedList" class="submitted-list"></div>

        <div class="analyze-row">
            <button id="analyzeBtn" class="btn btn-primary">开始分析</button>
        </div>

        <div id="chartsSection" class="charts-section hidden">
            <div class="chart-container">
                <div id="sentenceChart" style="width:100%;height:380px;"></div>
            </div>
            <div class="chart-container">
                <div id="wordFreqChart" style="width:100%;height:380px;"></div>
            </div>
            <div class="share-section">
                <div class="share-buttons">
                    <button class="btn btn-secondary" id="downloadChartBtn" title="下载图表图片">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        <span>下载图片</span>
                    </button>
                    <button class="social-btn icon-btn" data-platform="weibo" title="分享到微博">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#E6162D" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#E6162D"/></svg>
                        <span>微博</span>
                    </button>
                    <button class="social-btn icon-btn" data-platform="qzone" title="分享到QQ空间">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#F37B4B" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        <span>QQ空间</span>
                    </button>
                    <button class="social-btn icon-btn" data-platform="xiaohongshu" title="分享到小红书（需手动发布）">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FF2442" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v6l3-2 3 2V3" stroke-width="1.5"/></svg>
                        <span>小红书</span>
                    </button>
                    <button class="social-btn icon-btn" data-platform="zhihu" title="分享到知乎（需手动发布）">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10L9 16h8"/></svg>
                        <span>知乎</span>
                    </button>
                </div>
            </div>
        </div>
