    <script>
        const POST_FILES = [
            '6a328c40.html',
            '6a327020.html',
            '6a325400.html',
            '6a3245f0.html',
            '6a315de8.html',
            '6a313bec.html',
            '6a313ac0.html',
            '69f60a68.html',
            '69f61170.html',
            '69f71ca0.html',
            '6a22ba40.html',
            '6a23d33f.html',
            '6a23fdb0.html'
        ];

        async function loadBlogPosts() {
            const blogList = document.getElementById('blogList');
            blogList.innerHTML = '<p style="color:#999;text-align:center;">正在載入文章...</p>';

            const results = await Promise.allSettled(
                POST_FILES.map(async (filename) => {
                    const url = 'posts/' + filename;
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('not found');
                    const html = await res.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const h1 = doc.querySelector('h1');
                    const title = h1 ? h1.textContent.trim() : filename;
                    return { filename: url, title };
                })
            );

            const posts = results
                .filter(r => r.status === 'fulfilled')
                .map(r => r.value);

            posts.sort((a, b) => a.filename.localeCompare(b.filename));

            if (posts.length === 0) {
                blogList.innerHTML = '<p style="color:#999;text-align:center;">暫無文章。</p>';
                return;
            }

            blogList.innerHTML = '';
            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'blog-item';
                item.innerHTML = `
                    <a href="${post.filename}"><h3>${post.title}</h3></a>
                `;
                blogList.appendChild(item);
            });
        }

        loadBlogPosts();
    </script>
